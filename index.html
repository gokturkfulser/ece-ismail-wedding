<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ==========================================================================
       META / SOSYAL MEDYA KARTI
       --------------------------------------------------------------------------
       DİKKAT: Build step olmadığı için aşağıdaki değerler HTML'de STATİK kalır.
       CONFIG'i düzenledikten sonra bu blogu da ELLE güncelle.
       "CONFIG İLE EŞLE" yorumu olan her satır assets/js/config.js ile eşleşmeli.

       og:image ve og:url MUTLAKA tam (absolute) URL olmalı — WhatsApp ve Twitter
       scraper'ları göreli yolu okumaz. Sitenin gerçek adresini yaz.
       ========================================================================== -->

  <!-- CONFIG İLE EŞLE: bride + coupleSeparator + groom, dateLabel -->
  <title>Aybala Ece &amp; İsmail · 26 Eylül 2026</title>
  <!-- CONFIG İLE EŞLE: text.inviteBody[0] özeti -->
  <meta name="description" content="Aybala Ece ve İsmail'in düğün davetiyesi. 26 Eylül 2026, Park Lamore, Ankara. Katılım bildirimi için tıklayın.">

  <!-- CONFIG İLE EŞLE: --c-bg-dark (assets/css/style.css) -->
  <meta name="theme-color" content="#1f3d2b">
  <meta name="color-scheme" content="light">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <!-- CONFIG İLE EŞLE -->
  <meta property="og:site_name" content="Aybala Ece &amp; İsmail">
  <meta property="og:title" content="Aybala Ece &amp; İsmail · Düğün Davetiyesi">
  <meta property="og:description" content="26 Eylül 2026, Cumartesi · 12:00 – 16:00 · Park Lamore, Ankara. Katılım bildirimi için davetiyeyi açın.">
  <!-- TAM URL GEREKLİ — kendi Pages adresinle değiştir -->
  <meta property="og:url" content="https://gokturkfulser.github.io/ece-ismail-wedding/">
  <meta property="og:image" content="https://gokturkfulser.github.io/ece-ismail-wedding/assets/img/og.jpg?v=2">
  <meta property="og:image:secure_url" content="https://gokturkfulser.github.io/ece-ismail-wedding/assets/img/og.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Aybala Ece ve İsmail düğün davetiyesi">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <!-- CONFIG İLE EŞLE -->
  <meta name="twitter:title" content="Aybala Ece &amp; İsmail · Düğün Davetiyesi">
  <meta name="twitter:description" content="26 Eylül 2026, Cumartesi · 12:00 – 16:00 · Park Lamore, Ankara.">
  <meta name="twitter:image" content="https://gokturkfulser.github.io/ece-ismail-wedding/assets/img/og.jpg?v=2">
  <meta name="twitter:image:alt" content="Aybala Ece ve İsmail düğün davetiyesi">

  <!-- Scraper'lar (WhatsApp/Twitter dahil) canonical'ı og:url ile aynı tam
       adrese işaret etsin diye ekleniyor; arama motorları için de faydalı. -->
  <link rel="canonical" href="https://gokturkfulser.github.io/ece-ismail-wedding/">

  <!-- Favicon — tüm yollar GÖRELİ (alt path'te çalışması için) -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- CONFIG: sitenin tek içerik kaynağı. <head> içinde çünkü aşağıdaki
       preload script'i buna ihtiyaç duyuyor (LCP görselini erken başlatmak için). -->
  <script src="assets/js/config.js"></script>
  <script>
    /* Kapı ekranı görseli LCP elemanı. app.js body sonunda çalıştığı için
       indirmeyi burada preload ile başlatıyoruz — yol yine CONFIG'den geliyor,
       ikinci bir hardcode yok. */
    (function () {
      var gate = window.CONFIG && window.CONFIG.gate;
      if (!gate) return;
      var mobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
      var href = mobile ? gate.portrait : gate.landscape;
      if (!href) return;
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = href;
      link.setAttribute('fetchpriority', 'high');
      document.head.appendChild(link);
    })();
  </script>
</head>

<body>

  <noscript>
    <p class="noscript-note">
      Davetiyeyi görüntülemek için tarayıcınızda JavaScript'i etkinleştirmeniz gerekiyor.
    </p>
  </noscript>

  <!-- ==========================================================================
       KAPI EKRANI
       --------------------------------------------------------------------------
       Tam ekran, iki aşamalı:
         1) Karşılama: isim/tarih + "DAVETİYEYİ AÇ" butonu
         2) Butona basılınca → müzik başlar, karşılama solar, PİKSEL SAHNESİ
            oynar (karakterler yürür, buluşur, el ele tutuşur), sonra kapı
            fade-out olur ve element DOM'dan kaldırılır.

       Müzik MUTLAKA butonun click handler'ında başlar (autoplay policy).
       Animasyon uzun sürdüğü için "Atla" butonu var; kapıya tıklamak da atlar.
       prefers-reduced-motion açıksa 2. aşama hiç oynatılmaz, kapı direkt kapanır.
       ========================================================================== -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-names">
    <div class="gate__media scrim" id="gate-media"><!-- CONFIG.gate → app.js --></div>

    <div class="gate__content">
      <p class="gate__kicker" data-text="text.gateKicker"></p>

      <h1 class="gate__names" id="gate-names">
        <span data-text="bride"></span>
        <span class="gate__sep" aria-hidden="true" data-text="coupleSeparator"></span>
        <span data-text="groom"></span>
      </h1>

      <p class="gate__date" data-text="dateLabel"></p>

      <button class="btn btn--invert" type="button" id="gate-open" data-text="text.gateButton"></button>

      <p class="gate__hint" id="gate-hint" data-text="text.gateHint"></p>
    </div>

    <!-- ------------------------------------------------------------------------
         PİKSEL DAVETİYE SAHNESİ (kapı 2. aşama)
         ------------------------------------------------------------------------
         Kapsüllü bileşen (.dugun-davetiye). Stili style.css 19. bölümde,
         yıldız/konfeti üretimi app.js setupPixelScene() içinde.

         Tamamen dekoratif: aria-hidden. İsim ve tarih ekran okuyucuya kapının
         karşılama aşamasında ve fotoğraf bölümünde zaten okunuyor, tekrarlamıyoruz.

         Animasyon .is-running eklenince başlar — kapı butonuna basıldığı an.
         Zaman çizelgesi (sn): 0.6 giriş · 4.0 buluşma · 4.2 kalp · 4.4 konfeti
         · 5.2 yazı.

         Sprite'lar assets/img/ altında, width/height DOSYANIN GERÇEK piksel
         ölçüsü (CLS 0 için): gelin 68×114, damat 68×142.
         Ölçek 5:4 — CSS'te gelin `68 * --unit`, damat `68 * --unit * 0.8`.

         PNG'ler pixel art: optimize/yeniden boyutlandırma/WebP dönüşümü YAPILMAZ.
         --------------------------------------------------------------------- -->
    <div class="gate__scene" id="gate-scene" aria-hidden="true">
      <div class="dugun-davetiye" data-pixel-scene>
        <div class="gokyuzu"></div>
        <div class="zemin"></div>

        <!-- loading="lazy" YOK — bilinçli. Dördü tek zamanlı animasyonun
             kareleri; göz kırpma karesi 4.4s'te opacity 1'e geçiyor ve o an
             yüklü değilse yüz bir kare kayboluyor. Dördü toplam ~49KB. -->
        <img class="kisi gelin" alt="" src="assets/img/gelin.png" width="68" height="114" decoding="async">
        <img class="kisi gelin kirpik" alt="" src="assets/img/gelin-blink.png" width="68" height="114" decoding="async">
        <img class="kisi damat" alt="" src="assets/img/damat.png" width="68" height="142" decoding="async">
        <img class="kisi damat kirpik" alt="" src="assets/img/damat-blink.png" width="68" height="142" decoding="async">

        <div class="kalp">
          <svg viewBox="0 0 11 10" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">
            <path fill="#d4566b" d="M2 1h3v1h1V1h3v1h1v3h-1v1h-1v1h-1v1H6v1H5V8H4V7H3V6H2V5H1V2h1z"/>
            <path fill="#f08ba0" d="M2 2h2v1H3v1H2z"/>
          </svg>
        </div>

        <div class="konfeti"></div>

        <div class="yazi">
          <!-- İçerik CONFIG'den: index.html'de hardcode isim/tarih yok.
               "ve" bileşenin tipografik bağlacı (CONFIG.coupleSeparator "&"
               burada italik "ve" olarak çiziliyor), o yüzden markup'ta kalıyor. -->
          <p class="isimler">
            <span data-text="bride"></span><span class="ve">ve</span><span data-text="groom"></span>
          </p>
          <p class="tarih" data-text="dateLabel"></p>
        </div>
      </div>
    </div>

    <!-- Animasyonu atla. Sahne başlayınca görünür olur. -->
    <button class="gate__skip is-hidden" type="button" id="gate-skip"
            data-text="text.gateSkip"></button>
  </div>

  <!-- ==========================================================================
       SES KONTROLÜ
       --------------------------------------------------------------------------
       Müzik başarıyla çalmaya başlayana kadar gizli. Durum localStorage'da.
       ========================================================================== -->
  <button class="audio-toggle is-hidden is-muted" type="button" id="audio-toggle"
          aria-pressed="true" aria-label="Müziği aç">
    <svg class="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h3l5 4V5L7 9H4z"></path>
      <path d="M16 8.5a4.5 4.5 0 0 1 0 7"></path>
      <path d="M18.5 5.5a8 8 0 0 1 0 13"></path>
    </svg>
    <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h3l5 4V5L7 9H4z"></path>
      <path d="M16 9.5l5 5"></path>
      <path d="M21 9.5l-5 5"></path>
    </svg>
  </button>

  <main>

    <!-- ========================================================================
         1. FOTOĞRAF — kapıdan sonra sayfanın en üstündeki tam genişlik banner
            (CONFIG.photo), isimler fotoğrafın üstüne ortalı biniyor
         ======================================================================== -->
    <section class="photo" id="photo">
      <div class="photo__media scrim" id="photo-figure"><!-- CONFIG.photo → app.js --></div>

      <!-- Dekoratif partikül katmanı (CONFIG.options.particles = false ile kapanır) -->
      <div class="particles" data-particles aria-hidden="true"></div>

      <div class="photo__content" data-reveal>
        <h2 class="photo__names" id="photo-title" tabindex="-1">
          <span data-text="bride"></span>
          <span class="photo__sep" aria-hidden="true" data-text="coupleSeparator"></span>
          <span data-text="groom"></span>
        </h2>
      </div>

      <!-- Aşağıda form/detay olduğunu göstermek için — sayfa fotoğraftan
           sonra boş görünmesin, özellikle mobilde. Tıklanınca bir sonraki
           bölüme kaydırır; prefers-reduced-motion açıkken zıplama durur ama
           ok kalır. -->
      <button class="photo__scroll" type="button" id="photo-scroll" aria-label="Aşağı kaydır">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>
    </section>

    <!-- ========================================================================
         2. DAVETİYE METNİ
         ======================================================================== -->
    <section class="section section--floral" id="invite" aria-labelledby="invite-title">
      <div class="section__inner">
        <h2 class="section__title" id="invite-title" data-text="text.inviteTitle" data-reveal></h2>
        <hr class="section__rule">

        <!-- ?d= parametresi yoksa app.js bu bloğu tamamen kaldırır -->
        <p class="invite__greeting" id="greeting" data-reveal></p>

        <div class="invite__body" data-text-list="text.inviteBody" data-reveal></div>
      </div>
    </section>

    <!-- ========================================================================
         3. ETKİNLİK DETAYI
         ======================================================================== -->
    <section class="section section--alt section--floral" id="details" aria-labelledby="details-title">
      <div class="section__inner">
        <h2 class="section__title" id="details-title" data-text="text.detailsTitle" data-reveal></h2>
        <hr class="section__rule">

        <dl class="details__list" data-reveal>
          <div class="details__item">
            <dt class="details__label" data-text="text.detailsDateLabel"></dt>
            <dd class="details__value" data-text="dateLabel"></dd>
          </div>
          <div class="details__item">
            <dt class="details__label" data-text="text.detailsTimeLabel"></dt>
            <dd class="details__value" data-text="timeLabel"></dd>
          </div>
          <div class="details__item">
            <dt class="details__label" data-text="text.detailsVenueLabel"></dt>
            <dd class="details__value">
              <span data-text="venueName"></span>
              <span class="details__sub" data-text="venueAddress"></span>
            </dd>
          </div>
        </dl>

        <div class="btn-row btn-row--stack" data-reveal>
          <!-- Takvime Ekle: iki seçenek birlikte sunulur, UA sniffing yok -->
          <a class="btn" id="cal-google" href="#" target="_blank" rel="noopener"
             data-text="text.calendarGoogle"></a>
          <!-- invite.ics repo kökünde statik dosya (README'deki senkron notuna bak) -->
          <a class="btn btn--ghost" id="cal-ics" href="invite.ics" download
             data-text="text.calendarIcs"></a>
          <a class="btn btn--ghost" id="directions" href="#" target="_blank" rel="noopener"
             data-text="text.directionsButton"></a>
        </div>
      </div>
    </section>

    <!-- ========================================================================
         4. GERİ SAYIM
         ======================================================================== -->
    <section class="section section--dark" id="countdown-section" aria-labelledby="countdown-title">
      <div class="particles" data-particles aria-hidden="true"></div>

      <div class="section__inner">
        <h2 class="section__title" id="countdown-title" data-text="text.countdownTitle" data-reveal></h2>
        <hr class="section__rule">

        <ul class="countdown" id="countdown" data-reveal>
          <li class="countdown__cell">
            <span class="countdown__num" id="cd-days">00</span>
            <span class="countdown__label" data-text="text.countdownDays"></span>
          </li>
          <li class="countdown__cell">
            <span class="countdown__num" id="cd-hours">00</span>
            <span class="countdown__label" data-text="text.countdownHours"></span>
          </li>
          <li class="countdown__cell">
            <span class="countdown__num" id="cd-minutes">00</span>
            <span class="countdown__label" data-text="text.countdownMinutes"></span>
          </li>
          <li class="countdown__cell">
            <span class="countdown__num" id="cd-seconds">00</span>
            <span class="countdown__label" data-text="text.countdownSeconds"></span>
          </li>
        </ul>

        <!-- Tarih geçtiyse app.js listeyi gizler, bunu gösterir -->
        <p class="countdown-done is-hidden" id="countdown-done" data-text="text.countdownDone"></p>
      </div>
    </section>

    <!-- ========================================================================
         5. RSVP
         ======================================================================== -->
    <section class="section section--alt" id="rsvp" aria-labelledby="rsvp-title">
      <div class="section__inner">
        <h2 class="section__title" id="rsvp-title" data-text="text.rsvpTitle" data-reveal></h2>
        <hr class="section__rule">
        <p class="rsvp__intro" data-text="text.rsvpIntro" data-reveal></p>

        <!-- Son tarih geçtiyse app.js formu kaldırır ve bunu gösterir -->
        <div class="rsvp-closed is-hidden" id="rsvp-closed" data-reveal>
          <h3 data-text="text.rsvpClosedTitle"></h3>
          <p data-text="text.rsvpClosedText"></p>
        </div>

        <!-- Daha önce cevap verildiyse gösterilir; form kapalı gelir -->
        <div class="rsvp-note is-hidden" id="rsvp-note" data-reveal>
          <p data-text="text.rsvpAlreadyText"></p>
          <button class="btn btn--ghost" type="button" id="rsvp-reopen"
                  data-text="text.rsvpAlreadyButton"></button>
        </div>

        <form class="form" id="rsvp-form" novalidate data-reveal>

          <!-- Katılım durumu -->
          <fieldset class="field fieldset">
            <legend class="field__label" data-text="text.rsvpAttendingLabel"></legend>

            <div class="choice">
              <label class="choice__option">
                <input class="choice__input" type="radio" name="attending" value="yes" required>
                <span class="choice__face" data-text="text.rsvpYes"></span>
              </label>
              <label class="choice__option">
                <input class="choice__input" type="radio" name="attending" value="no" required>
                <span class="choice__face" data-text="text.rsvpNo"></span>
              </label>
            </div>

            <p class="field__error" id="err-attending" role="alert"></p>
          </fieldset>

          <!-- Ad Soyad -->
          <div class="field">
            <label class="field__label" for="rsvp-name" data-text="text.rsvpNameLabel"></label>
            <input class="input" type="text" id="rsvp-name" name="name"
                   autocomplete="name" enterkeyhint="next" required
                   maxlength="80"
                   data-attr="placeholder:text.rsvpNamePlaceholder">
            <p class="field__error" id="err-name" role="alert"></p>
          </div>

          <!-- Kişi sayısı -->
          <div class="field">
            <label class="field__label" for="rsvp-guests" data-text="text.rsvpGuestsLabel"></label>
            <input class="input" type="number" id="rsvp-guests" name="guests"
                   inputmode="numeric" min="1" max="10" step="1" value="1" required>
            <p class="field__hint" data-text="text.rsvpGuestsHint"></p>
            <p class="field__error" id="err-guests" role="alert"></p>
          </div>

          <!-- Mesaj -->
          <div class="field">
            <label class="field__label" for="rsvp-message">
              <span data-text="text.rsvpMessageLabel"></span>
              <span class="field__hint field__hint--inline" data-text="text.rsvpMessageHint"></span>
            </label>
            <textarea class="textarea" id="rsvp-message" name="message" maxlength="500"
                      data-attr="placeholder:text.rsvpMessagePlaceholder"></textarea>
            <p class="field__hint" id="rsvp-message-count" aria-hidden="true"></p>
          </div>

          <!-- ============================ HONEYPOT ============================
               Bot tuzağı. Ekran dışında, klavyeyle erişilemez, otomatik
               doldurma kapalı. Dolu gelirse app.js sessizce başarılı gibi
               davranır ve HİÇBİR ŞEY GÖNDERMEZ. CAPTCHA yok.
               ================================================================= -->
          <div class="honeypot" aria-hidden="true">
            <label for="rsvp-website">Website</label>
            <input type="text" id="rsvp-website" name="website"
                   tabindex="-1" autocomplete="off">
          </div>

          <button class="btn btn--block" type="submit" id="rsvp-submit">
            <span class="spinner is-hidden" id="rsvp-spinner" aria-hidden="true"></span>
            <span id="rsvp-submit-label" data-text="text.rsvpSubmit"></span>
          </button>

          <!-- Sonuç mesajı -->
          <p class="form__status" id="rsvp-status" role="status" aria-live="polite"></p>

          <div class="form__retry is-hidden" id="rsvp-retry">
            <button class="btn btn--ghost" type="button" id="rsvp-retry-btn"
                    data-text="text.rsvpRetry"></button>
          </div>
        </form>
      </div>
    </section>

    <!-- ========================================================================
         6. KONUM
         ======================================================================== -->
    <section class="section" id="location" aria-labelledby="location-title">
      <div class="section__inner section__inner--wide">
        <h2 class="section__title" id="location-title" data-text="text.locationTitle" data-reveal></h2>
        <hr class="section__rule">

        <p class="location__address">
          <strong data-text="venueName"></strong><br>
          <span data-text="venueAddress"></span>
        </p>

        <!-- API key gerektirmeyen embed formu; src app.js tarafından atanır -->
        <div class="map" data-reveal>
          <iframe id="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  allowfullscreen data-attr="title:text.mapEmbedTitle"></iframe>
        </div>

        <div class="btn-row" data-reveal>
          <a class="btn btn--ghost" id="map-google" href="#" target="_blank" rel="noopener"
             data-text="text.mapGoogle"></a>
          <a class="btn btn--ghost" id="map-apple" href="#" target="_blank" rel="noopener"
             data-text="text.mapApple"></a>
          <a class="btn btn--ghost" id="map-yandex" href="#" target="_blank" rel="noopener"
             data-text="text.mapYandex"></a>
        </div>
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       7. FOOTER
       ========================================================================== -->
  <footer class="footer">
    <p class="footer__names">
      <span data-text="bride"></span>
      <span aria-hidden="true" data-text="coupleSeparator"></span>
      <span data-text="groom"></span>
    </p>
    <p class="footer__note" data-text="text.footerNote"></p>
    <p class="footer__credit" data-text="text.footerCredit"></p>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
